name: Docker

on:
  pull_request:
  push:
    branches: [main]

  # called by release.yml
  workflow_call:
    inputs:
      tag:
        description: Existing release tag (eg. v1.2.3)
        required: true
        type: string

  # for failed runs
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (eg. v1.2.3)
        required: true
        type: string

  # for draft releases
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

concurrency:
  group: docker-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: cert-it-ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v4

      # load it under the tag the dev compose uses
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cert-it:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start dev stack
        working-directory: deploy/dev
        run: docker compose up -d --wait --wait-timeout 120

      - name: Run checks
        run: bash deploy/dev/check.sh

      - name: Show logs
        if: failure()
        working-directory: deploy/dev
        run: docker compose logs

      - name: Stop dev stack
        if: always()
        working-directory: deploy/dev
        run: docker compose down -v

  publish:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.TAG != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
