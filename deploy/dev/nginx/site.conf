server {
    listen 443 ssl default_server;
    listen 80 default_server;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/letsencrypt/live/certs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certs.example.org/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';";
    proxy_hide_header Content-Security-Policy;

    location / {
        default_type text/plain;
        return 200 "landing\n";
    }

    include /etc/nginx/cert-it/path.conf;
}
