# cert-it on its own host. Copy into nginx's conf.d/ and set in config.yml:
#   site.base_url: https://certs.example.org
#   files.serve:   accel
#
# Replace certs.example.org, the certificate paths, 127.0.0.1:3000 (APP_PORT)
# and /srv/cert-it (CERT_IT_DIR).

server {
    listen 80;
    listen [::]:80;
    server_name certs.example.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name certs.example.org;

    ssl_certificate     /etc/letsencrypt/live/certs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certs.example.org/privkey.pem;

    # must be larger than uploads.max_pdf_mb and uploads.max_font_mb
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # nginx's user needs read access to data/certificates/, for example
    # through membership in the group APP_GID.
    location /_files/ {
        internal;
        alias /srv/cert-it/data/certificates/;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
