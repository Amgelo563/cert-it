# cert-it under /certs/ of an existing site. Paste into that site's server { }
# block, replacing any existing location for the same path, and set in
# config.yml:
#   site.base_url: https://example.org/certs
#   files.serve:   stream
#
# To use another path, replace /certs in every block. Replace 127.0.0.1:3000
# with the app's port (APP_PORT).

location /certs/ {
    # must be larger than uploads.max_pdf_mb and uploads.max_font_mb
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header X-Real-IP $remote_addr;
}

# Only needed if the site sets its own Content-Security-Policy: the admin
# panel needs this one to work.
location /certs/admin/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}

# Only with files.serve: accel. nginx's user needs read access to
# data/certificates/, for example through membership in the group APP_GID.
